name: Defect report
description: Record and track a defect found during testing or debugging
title: "Defect: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Defect summary
      description: What went wrong
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that reproduce the defect
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Add useful logs, screenshots, failing tests, or request details
