name: Demo Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/demo.yml'
      - 'frontend/**'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  demo:
    name: Open app and capture demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: demo_password
      APP_TIMEZONE: America/Toronto

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Start full application
        run: docker compose up -d --build

      - name: Wait for application
        shell: bash
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "Warranty Tracker is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Capture demo
        working-directory: frontend
        run: npx playwright test tests/demo.spec.ts

      - name: Upload demo artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warranty-tracker-demo
          path: frontend/test-results/
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
